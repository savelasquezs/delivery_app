name: Tracking validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracking-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify Google Play distribution policy
        run: bash scripts/verify_play_only_distribution.sh
      - name: Verify reviewed source tree
        run: |
          if git ls-files '.automation/*' | grep -q .; then
            echo 'Temporary transfer files must not be merged.'
            exit 1
          fi
      - name: Restore pinned Flutter SDK
        id: flutter-sdk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-linux
      - name: Install pinned project Flutter
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          if [[ ! -x "$FLUTTER_DIR/bin/flutter" ]]; then
            git clone --depth=1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          fi
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" --version
          "$FLUTTER_DIR/bin/flutter" precache --linux
      # Save the SDK before running project builds or restoring signing credentials.
      - name: Save pinned Flutter SDK
        if: steps.flutter-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/flutter
          key: ${{ steps.flutter-sdk.outputs.cache-primary-key }}
      - name: Cache hosted pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Keep pub credentials and project build outputs out of the cache.
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/hosted-hashes
          key: pub-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - name: Check dependency lockfile
        run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - name: Repeat native concurrency and durable outbox regressions
        run: |
          for attempt in 1 2 3; do
            flutter test test/session_mutex_test.dart test/tracking_outbox_test.dart --reporter expanded
          done
