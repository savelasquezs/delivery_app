name: Publicar en Google Play - Prueba interna

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-internal
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.senorarroz.delivery_app
  PLAY_TRACK: internal
  FLUTTER_VERSION: 3.41.6
  WORKLOAD_IDENTITY_PROVIDER: projects/347957868437/locations/global/workloadIdentityPools/github-actions/providers/github-delivery
  GOOGLE_SERVICE_ACCOUNT: google-play-publisher@restaurante-railway.iam.gserviceaccount.com

jobs:
  play:
    name: Compilar, validar y publicar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validar distribución exclusiva por Google Play
        shell: bash
        run: bash scripts/verify_play_only_distribution.sh

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore pinned Flutter SDK
        id: flutter-sdk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-android
      - name: Install pinned project Flutter
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          if [[ ! -x "$FLUTTER_DIR/bin/flutter" ]]; then
            git clone --depth=1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          fi
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" --version
          "$FLUTTER_DIR/bin/flutter" precache --android
      # Save the SDK before running project builds or restoring signing credentials.
      - name: Save pinned Flutter SDK
        if: steps.flutter-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/flutter
          key: ${{ steps.flutter-sdk.outputs.cache-primary-key }}
      - name: Cache hosted pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Keep pub credentials and project build outputs out of the cache.
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/hosted-hashes
          key: pub-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Never cache Gradle configuration, signing files, or build outputs.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ env.FLUTTER_VERSION }}-
      - name: Restaurar Gradle Wrapper si no está versionado
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew || ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            SEED_DIR="$RUNNER_TEMP/flutter_wrapper_seed"
            flutter create --no-pub --project-name flutter_wrapper_seed --platforms=android "$SEED_DIR"
            cp "$SEED_DIR/android/gradlew" android/gradlew
            cp "$SEED_DIR/android/gradlew.bat" android/gradlew.bat
            cp "$SEED_DIR/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi

      - name: Leer y validar versión visible
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"

          if [[ "$PUBSPEC_VERSION" != *+* ]]; then
            echo "::error::pubspec.yaml debe usar version: x.y.z+build"
            exit 1
          fi

          VERSION_NAME="${PUBSPEC_VERSION%%+*}"
          CONFIGURED_VERSION_CODE="${PUBSPEC_VERSION##*+}"

          if [[ ! "$CONFIGURED_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::El build number de pubspec.yaml debe ser numérico."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "configured_version_code=$CONFIGURED_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Autenticar con Google Cloud sin clave JSON
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Resolver versionCode automático desde Google Play
        id: play_version
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONFIGURED_VERSION_CODE: ${{ steps.version.outputs.configured_version_code }}
        run: |
          set -euo pipefail
          API_ROOT="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"

          EDIT_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$API_ROOT/edits")"

          EDIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$EDIT_RESPONSE")"

          BUNDLES_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API_ROOT/edits/$EDIT_ID/bundles")"

          export BUNDLES_RESPONSE CONFIGURED_VERSION_CODE
          VERSION_CODE="$(python3 - <<'PY'
          import json, os

          data = json.loads(os.environ["BUNDLES_RESPONSE"])
          configured = int(os.environ["CONFIGURED_VERSION_CODE"])
          existing = [
              int(bundle["versionCode"])
              for bundle in data.get("bundles", [])
              if str(bundle.get("versionCode", "")).isdigit()
          ]
          next_from_play = (max(existing) + 1) if existing else 1
          print(max(configured, next_from_play))
          PY
          )"

          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API_ROOT/edits/$EDIT_ID" > /dev/null

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versionCode resuelto automáticamente: $VERSION_CODE"

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Restaurar firma Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_STORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Faltan secretos de firma Android."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      - name: Compilar App Bundle firmado
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.play_version.outputs.version_code }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

      - name: Validar conexión con Google Play
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          API_ROOT="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"

          EDIT_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$API_ROOT/edits")"

          EDIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$EDIT_RESPONSE")"

          TRACKS_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API_ROOT/edits/$EDIT_ID/tracks")"

          export TRACKS_RESPONSE
          python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["TRACKS_RESPONSE"])
          tracks = [t.get("track") for t in data.get("tracks", [])]
          print("Tracks disponibles:", ", ".join(tracks))
          if "internal" not in tracks:
              raise SystemExit("No se encontró el track interno 'internal'.")
          PY

          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API_ROOT/edits/$EDIT_ID" > /dev/null

          echo "Validación correcta: firma, WIF y acceso a Google Play funcionan."

      - name: Publicar en Prueba interna de Google Play
        if: github.event_name == 'push'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.play_version.outputs.version_code }}
        run: |
          set -euo pipefail

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          API_ROOT="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"
          UPLOAD_ROOT="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE_NAME"

          EDIT_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$API_ROOT/edits")"

          EDIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$EDIT_RESPONSE")"

          BUNDLE_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --retry 3 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$AAB_PATH" \
            "$UPLOAD_ROOT/edits/$EDIT_ID/bundles?uploadType=media")"

          UPLOADED_VERSION_CODE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])' <<< "$BUNDLE_RESPONSE")"

          if [[ "$UPLOADED_VERSION_CODE" != "$VERSION_CODE" ]]; then
            echo "::error::Google Play recibió versionCode $UPLOADED_VERSION_CODE, pero el CI resolvió $VERSION_CODE."
            exit 1
          fi

          export UPLOADED_VERSION_CODE
          TRACK_BODY="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "track": os.environ["PLAY_TRACK"],
              "releases": [{
                  "name": f"{os.environ['VERSION_NAME']} ({os.environ['UPLOADED_VERSION_CODE']})",
                  "versionCodes": [os.environ["UPLOADED_VERSION_CODE"]],
                  "releaseNotes": [{
                      "language": "es-419",
                      "text": f"Actualización interna {os.environ['VERSION_NAME']}."
                  }],
                  "status": "completed"
              }]
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$TRACK_BODY" \
            "$API_ROOT/edits/$EDIT_ID/tracks/$PLAY_TRACK" > /dev/null

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API_ROOT/edits/$EDIT_ID:commit" > /dev/null

          echo "Publicado: $PACKAGE_NAME $VERSION_NAME ($UPLOADED_VERSION_CODE) en Prueba interna."
