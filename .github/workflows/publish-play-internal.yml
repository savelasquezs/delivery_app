name: Publicar en Google Play - Prueba interna

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-internal
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.senorarroz.delivery_app
  PLAY_TRACK: qa
  FLUTTER_REVISION: db50e20168db8fee486b9abf32fc912de3bc5b6a
  WORKLOAD_IDENTITY_PROVIDER: projects/347957868437/locations/global/workloadIdentityPools/github-actions/providers/github-delivery
  GOOGLE_SERVICE_ACCOUNT: google-play-publisher@restaurante-railway.iam.gserviceaccount.com

jobs:
  publish:
    name: Compilar y publicar AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter fijado al proyecto
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          git init "$FLUTTER_DIR"
          git -C "$FLUTTER_DIR" remote add origin https://github.com/flutter/flutter.git
          git -C "$FLUTTER_DIR" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$FLUTTER_DIR" checkout --detach FETCH_HEAD
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" --version

      - name: Restaurar Gradle Wrapper si no está versionado
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew || ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            SEED_DIR="$RUNNER_TEMP/flutter-wrapper-seed"
            flutter create --platforms=android "$SEED_DIR"
            cp "$SEED_DIR/android/gradlew" android/gradlew
            cp "$SEED_DIR/android/gradlew.bat" android/gradlew.bat
            cp "$SEED_DIR/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi

      - name: Validar versión del tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"

          if [[ "$PUBSPEC_VERSION" != *+* ]]; then
            echo "::error::pubspec.yaml debe usar version: x.y.z+build"
            exit 1
          fi

          VERSION_NAME="${PUBSPEC_VERSION%%+*}"
          VERSION_CODE="${PUBSPEC_VERSION##*+}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::El build number de pubspec.yaml debe ser numérico."
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$VERSION_NAME" ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con pubspec.yaml ($VERSION_NAME)."
            echo "::error::Ejemplo: version: 1.2.6+11 requiere el tag v1.2.6."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Restaurar firma Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_STORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Faltan secretos de firma Android en Settings > Secrets and variables > Actions."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      - name: Compilar App Bundle firmado
        run: flutter build appbundle --release --dart-define=DELIVERY_PLAY_DISTRIBUTION=true

      - name: Autenticar con Google Cloud sin clave JSON
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Publicar en Prueba interna de Google Play
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          API_ROOT="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"
          UPLOAD_ROOT="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE_NAME"

          if [[ ! -f "$AAB_PATH" ]]; then
            echo "::error::No se encontró $AAB_PATH"
            exit 1
          fi

          echo "Creando edición en Google Play..."
          EDIT_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$API_ROOT/edits")"

          EDIT_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$EDIT_RESPONSE")"

          echo "Subiendo AAB..."
          BUNDLE_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --retry 3 \
            --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$AAB_PATH" \
            "$UPLOAD_ROOT/edits/$EDIT_ID/bundles?uploadType=media")"

          UPLOADED_VERSION_CODE="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])' <<< "$BUNDLE_RESPONSE")"

          if [[ "$UPLOADED_VERSION_CODE" != "$VERSION_CODE" ]]; then
            echo "::error::Google Play recibió versionCode $UPLOADED_VERSION_CODE, pero pubspec.yaml indica $VERSION_CODE."
            exit 1
          fi

          export UPLOADED_VERSION_CODE
          TRACK_BODY="$(python3 - <<'PY'
          import json
          import os

          version_name = os.environ["VERSION_NAME"]
          version_code = os.environ["UPLOADED_VERSION_CODE"]
          track = os.environ["PLAY_TRACK"]

          print(json.dumps({
              "track": track,
              "releases": [{
                  "name": f"{version_name} ({version_code})",
                  "versionCodes": [version_code],
                  "releaseNotes": [{
                      "language": "es-419",
                      "text": f"Actualización interna {version_name}."
                  }],
                  "status": "completed"
              }]
          }))
          PY
          )"

          echo "Asignando versionCode $UPLOADED_VERSION_CODE al canal interno..."
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$TRACK_BODY" \
            "$API_ROOT/edits/$EDIT_ID/tracks/$PLAY_TRACK" > /dev/null

          echo "Confirmando edición..."
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$API_ROOT/edits/$EDIT_ID:commit" > /dev/null

          echo "Publicado: $PACKAGE_NAME $VERSION_NAME ($UPLOADED_VERSION_CODE) en Prueba interna."
