name: Android SQLite startup smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlite-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  sqlite-android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require completed hotfix preparation
        run: test ! -f .github/workflows/prepare-sqlite-hotfix.yml
      - name: Verify Play-only distribution
        run: bash scripts/verify_play_only_distribution.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore pinned Flutter SDK
        id: flutter-sdk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-android
      - name: Install pinned project Flutter
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          if [[ ! -x "$FLUTTER_DIR/bin/flutter" ]]; then
            git clone --depth=1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          fi
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" --version
          "$FLUTTER_DIR/bin/flutter" precache --android
      # Save the SDK before running project builds or restoring signing credentials.
      - name: Save pinned Flutter SDK
        if: steps.flutter-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/flutter
          key: ${{ steps.flutter-sdk.outputs.cache-primary-key }}
      - name: Cache hosted pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Keep pub credentials and project build outputs out of the cache.
          path: |
            ~/.pub-cache/hosted
            ~/.pub-cache/hosted-hashes
          key: pub-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - run: git diff --exit-code -- pubspec.lock
      - name: Cache Gradle dependencies and wrapper
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Never cache Gradle configuration, signing files, or build outputs.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ env.FLUTTER_VERSION }}-
      - name: Reduce Gradle resource use alongside Android emulator
        shell: bash
        run: |
          # The project's 8 GiB Gradle heap exceeds a hosted runner once
          # the Android emulator is also running. Set CI-only limits.
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

      - name: Restore Gradle wrapper for integration tests
        run: |
          if [[ ! -f android/gradlew || ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            flutter create --no-pub --project-name smoke_wrapper --platforms=android "$RUNNER_TEMP/smoke_wrapper"
            cp "$RUNNER_TEMP/smoke_wrapper/android/gradlew" android/gradlew
            cp "$RUNNER_TEMP/smoke_wrapper/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi
      - name: Free hosted runner disk before installing Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h /
          # These toolchains are not used by this Flutter/Android project.
          # Leave JDK 17 and the Android SDK untouched.
          for path in /usr/share/dotnet /usr/local/share/powershell /usr/local/share/boost /opt/hostedtoolcache/CodeQL; do
            if [[ -e "$path" ]]; then sudo rm -rf "$path"; fi
          done
          docker system prune -af --volumes >/dev/null 2>&1 || true
          echo "Disk usage after cleanup:"
          df -h /
          # Android emulator + NDK + Gradle require free space simultaneously.
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if (( available_kb < 6291456 )); then
            echo "::error::Insufficient free disk for Android instrumentation tests"
            exit 1
          fi
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android SQLite plugin regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: flutter test integration_test/android_sqlite_startup_test.dart -d emulator-5554 --reporter expanded
