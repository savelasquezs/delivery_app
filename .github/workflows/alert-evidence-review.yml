name: Android alert evidence validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/features/tracking/**'
      - 'test/**'
      - 'pubspec.*'
      - '.github/workflows/alert-evidence-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify distribution and reviewed source tree
        run: |
          bash scripts/verify_play_only_distribution.sh
          if git ls-files '.automation/*' | grep -q .; then
            echo 'Temporary transfer files must not be merged.'
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install project Flutter
        run: |
          git clone --depth=1 --branch 3.41.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
      - name: Compile Android integration without distributing
        run: flutter build appbundle --debug
      - name: Native evidence state-machine tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
