name: delivery_app
description: App móvil para domiciliarios de Señor Arroz
publish_to: "none"
# Al publicar: subir version (+build), compilar APK, copiar a senorArrozFront/public/ y
# actualizar senorArrozFront/public/delivery-app-release.json (mismo versionName/buildNumber).
version: 1.2.3+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.8.0+1

  # Almacenamiento seguro
  flutter_secure_storage: ^9.2.4

  # Navegación
  go_router: ^14.8.1

  # SignalR
  signalr_netcore: ^1.3.6

  # Formateo
  intl: ^0.20.2

  # Utilidades
  equatable: ^2.0.7
  package_info_plus: ^8.1.2
  battery_plus: ^7.1.1
  uuid: ^4.5.3
  font_awesome_flutter: ^10.8.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # Gráficos (métricas)
  fl_chart: ^0.70.2

  # Mapa interactivo (OpenStreetMap, sin API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Imágenes
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Push Notifications (Firebase Cloud Messaging)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Env
  flutter_dotenv: ^5.2.1
  flutter_foreground_task: ^9.2.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
